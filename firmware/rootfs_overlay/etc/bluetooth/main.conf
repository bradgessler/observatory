# bluetoothd settings for the box (Firmware.Bluetooth starts the daemon).
# Comments stay on their own lines: the parser reads a trailing # as part of
# the value.

[LE]
# Passive scanning at about a 10% duty cycle instead of BlueZ's ~50%: every
# advert heard is a D-Bus message the BEAM decodes, and a Pi 3 has little to
# spare. 480 x 0.625 ms = 300 ms interval, 48 x 0.625 ms = 30 ms window.
ScanIntervalAdvMonitor=480
ScanWindowAdvMonitor=48
