<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="The 24 places the telescope steps to, spread evenly over a disc 3 arcminutes across, with the biggest dust shadow drawn to the same scale for comparison">
