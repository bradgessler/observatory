<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-label="Holding the D-pad: 2 times the sky's speed at first, 8 times after a second and a half, 32 times after four seconds"><style>
.bg{fill:#12151c}.box{fill:#1b2029;stroke:#2e3544;stroke-width:1.5}.hot{fill:#1c2740;stroke:#6ea8ff;stroke-width:1.5}.t{fill:#e6e8ee;font:700 21px -apple-system,system-ui,sans-serif}.h{fill:#e6e8ee;font:700 18px -apple-system,system-ui,sans-serif}.d{fill:#9aa1b3;font:15px -apple-system,system-ui,sans-serif}.s{fill:#e6e8ee;font:600 16px -apple-system,system-ui,sans-serif}.k{fill:#6ea8ff;font:700 13px -apple-system,system-ui,sans-serif;letter-spacing:.06em}.ac{stroke:#6ea8ff;stroke-width:3;fill:none}.acf{fill:#6ea8ff}.ln{stroke:#9aa1b3;stroke-width:2;fill:none}.faint{stroke:#2e3544;stroke-width:1.5;fill:none}.red{fill:#ff5d5d}.redbg{fill:#1a0707;stroke:#5c1b1b;stroke-width:2}
@media (prefers-color-scheme: light){.bg{fill:#fff}.box{fill:#f3f5f8;stroke:#dde1e8}.hot{fill:#e8effd;stroke:#2457d6}.t,.h,.s{fill:#14171d}.d{fill:#5a6372}.k{fill:#2457d6}.ac{stroke:#2457d6}.acf{fill:#2457d6}.ln{stroke:#5a6372}.faint{stroke:#dde1e8}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acf"/></marker></defs><rect class="bg" width="600" height="390" rx="16"/>
<text class="t" x="24" y="46">Hold the D-pad longer, go faster</text>
<text class="d" x="24" y="72">speed, in multiples of how fast the sky turns</text>
<line class="faint" x1="70" y1="260.0" x2="545" y2="260.0"/><text class="d" x="60" y="265.0" text-anchor="end">2×</text><line class="faint" x1="70" y1="180.0" x2="545" y2="180.0"/><text class="d" x="60" y="185.0" text-anchor="end">8×</text><line class="faint" x1="70" y1="100.0" x2="545" y2="100.0"/><text class="d" x="60" y="105.0" text-anchor="end">32×</text><line class="ln" x1="70" y1="300" x2="545" y2="300"/><text class="d" x="70" y="328" text-anchor="middle">0 s</text><text class="d" x="165" y="328" text-anchor="middle">1 s</text><text class="d" x="260" y="328" text-anchor="middle">2 s</text><text class="d" x="355" y="328" text-anchor="middle">3 s</text><text class="d" x="450" y="328" text-anchor="middle">4 s</text><text class="d" x="545" y="328" text-anchor="middle">5 s</text>
<path class="ac" d="M70,260.0 L212.5,260.0 L212.5,180.0 L450,180.0 L450,100.0 L545,100.0"/>
<text class="s" x="79.5" y="248.0">a tap: fine centering</text>
<text class="s" x="222.0" y="168.0">crossing a cluster</text>
<text class="s" x="364.5" y="88.0">getting somewhere</text>
<text class="d" x="300" y="362" text-anchor="middle">how long you've held it</text>
</svg>