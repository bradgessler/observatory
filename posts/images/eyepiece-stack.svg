<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 728" role="img" aria-label="Everything between my thumb and the motors: nudging goes through the eyepiece's directions and which motor moves the view; going to something goes through where it is right now and how crooked the mount is; both end at the two motors"><style>
.bg{fill:#12151c}.box{fill:#1b2029;stroke:#2e3544;stroke-width:1.5}.hot{fill:#1c2740;stroke:#6ea8ff;stroke-width:1.5}.t{fill:#e6e8ee;font:700 21px -apple-system,system-ui,sans-serif}.h{fill:#e6e8ee;font:700 18px -apple-system,system-ui,sans-serif}.d{fill:#9aa1b3;font:15px -apple-system,system-ui,sans-serif}.s{fill:#e6e8ee;font:600 16px -apple-system,system-ui,sans-serif}.k{fill:#6ea8ff;font:700 13px -apple-system,system-ui,sans-serif;letter-spacing:.06em}.ac{stroke:#6ea8ff;stroke-width:3;fill:none}.acf{fill:#6ea8ff}.ln{stroke:#9aa1b3;stroke-width:2;fill:none}.faint{stroke:#2e3544;stroke-width:1.5;fill:none}.red{fill:#ff5d5d}.redbg{fill:#1a0707;stroke:#5c1b1b;stroke-width:2}
@media (prefers-color-scheme: light){.bg{fill:#fff}.box{fill:#f3f5f8;stroke:#dde1e8}.hot{fill:#e8effd;stroke:#2457d6}.t,.h,.s{fill:#14171d}.d{fill:#5a6372}.k{fill:#2457d6}.ac{stroke:#2457d6}.acf{fill:#2457d6}.ln{stroke:#5a6372}.faint{stroke:#dde1e8}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acf"/></marker></defs><rect class="bg" width="600" height="728" rx="16"/>
<text class="t" x="24" y="50">Everything between my thumb and the motors</text>
<text class="k" x="24" y="96">NUDGING IT</text><rect class="hot" x="24" y="112" width="265" height="92" rx="12"/><text class="h" x="40" y="144">I push up</text><text class="d" x="40" y="168">on the D-pad, or pull up</text><text class="d" x="40" y="187">on the phone</text><path class="ac" d="M156,206 L156,226" marker-end="url(#ah)"/><rect class="box" x="24" y="232" width="265" height="92" rx="12"/><text class="h" x="40" y="264">What's up in this eyepiece?</text><text class="d" x="40" y="288">a mirror flips the view, and</text><text class="d" x="40" y="307">the eyepiece's twist turns it</text><path class="ac" d="M156,326 L156,346" marker-end="url(#ah)"/><rect class="box" x="24" y="352" width="265" height="92" rx="12"/><text class="h" x="40" y="384">Which motor does that?</text><text class="d" x="40" y="408">here, up means turning</text><text class="d" x="40" y="427">the RA motor backwards</text><path class="ac" d="M156,446 L156,466" marker-end="url(#ah)"/><rect class="box" x="24" y="472" width="265" height="92" rx="12"/><text class="h" x="40" y="504">Keep pace with the sky</text><text class="d" x="40" y="528">add the sky's own turning so</text><text class="d" x="40" y="547">the stars don't slide away</text><text class="k" x="311" y="96">GOING TO SOMETHING</text><rect class="hot" x="311" y="112" width="265" height="92" rx="12"/><text class="h" x="327" y="144">I pick the Moon</text><text class="d" x="327" y="168">on the Tonight list,</text><text class="d" x="327" y="187">and tap Go To</text><path class="ac" d="M443,206 L443,226" marker-end="url(#ah)"/><rect class="box" x="311" y="232" width="265" height="92" rx="12"/><text class="h" x="327" y="264">Where is it right now?</text><text class="d" x="327" y="288">from my yard, not the center</text><text class="d" x="327" y="307">of the Earth, at this second</text><path class="ac" d="M443,326 L443,346" marker-end="url(#ah)"/><rect class="box" x="311" y="352" width="265" height="92" rx="12"/><text class="h" x="327" y="384">How crooked is the mount?</text><text class="d" x="327" y="408">axis 5.3° off, tripod not</text><text class="d" x="327" y="427">level, motors started anywhere</text><path class="ac" d="M443,446 L443,466" marker-end="url(#ah)"/><rect class="box" x="311" y="472" width="265" height="92" rx="12"/><text class="h" x="327" y="504">Keep it in the middle</text><text class="d" x="327" y="528">correct both motors as</text><text class="d" x="327" y="547">the sky turns</text><path class="ac" d="M156,572 L156,600 L270,600" /><path class="ac" d="M443,572 L443,600 L330,600"/>
<path class="ac" d="M300,600 L300,624" marker-end="url(#ah)"/>
<rect class="box" x="150" y="628" width="300" height="78" rx="12"/>
<text class="h" x="300" y="660" text-anchor="middle">The two motors</text>
<text class="d" x="300" y="684" text-anchor="middle">so many steps a second, each way</text></svg>