<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-label="Take a photo, clean it up, match it on a star map, measure how crooked the mount is, go to the Moon, keep it there"><style>
.bg{fill:#12151c}.box{fill:#1b2029;stroke:#2e3544;stroke-width:1.5}.t{fill:#e6e8ee;font:700 22px -apple-system,system-ui,sans-serif}.d{fill:#9aa1b3;font:16px -apple-system,system-ui,sans-serif}.s{fill:#e6e8ee;font:600 17px -apple-system,system-ui,sans-serif}.n{fill:#6ea8ff;font:700 16px -apple-system,system-ui,sans-serif}.ln{stroke:#9aa1b3;stroke-width:2;fill:none}.ac{stroke:#6ea8ff;stroke-width:3;fill:none}.acf{fill:#6ea8ff}.warn{fill:#ff8a7a}.warns{stroke:#ff8a7a;stroke-width:3;fill:none}.faint{stroke:#2e3544;stroke-width:1.5;fill:none}.dash{stroke:#9aa1b3;stroke-width:2;fill:none;stroke-dasharray:7 6}.fill2{fill:#1b2029}
