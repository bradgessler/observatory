</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acf"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1b3"/></marker></defs><rect class="bg" width="600" height="330" rx="16"/><rect class="box" x="20" y="20" width="160" height="120" rx="14"/><text class="n" x="36" y="50">1</text><text class="t" x="36" y="78">Take a photo</text><text class="d" x="36" y="104">through the</text><text class="d" x="36" y="124">eyepiece</text><rect class="box" x="220" y="20" width="160" height="120" rx="14"/><text class="n" x="236" y="50">2</text><text class="t" x="236" y="78">Clean it up</text><text class="d" x="236" y="104">keep just</text><text class="d" x="236" y="124">the stars</text><rect class="box" x="420" y="20" width="160" height="120" rx="14"/><text class="n" x="436" y="50">3</text><text class="t" x="436" y="78">Match it</text><text class="d" x="436" y="104">find the stars</text><text class="d" x="436" y="124">on a star map</text><rect class="box" x="20" y="190" width="160" height="120" rx="14"/><text class="n" x="36" y="220">4</text><text class="t" x="36" y="248">Measure</text><text class="d" x="36" y="274">how crooked</text><text class="d" x="36" y="294">the mount is</text><rect class="box" x="220" y="190" width="160" height="120" rx="14"/><text class="n" x="236" y="220">5</text><text class="t" x="236" y="248">Go to it</text><text class="d" x="236" y="274">swing to</text><text class="d" x="236" y="294">the Moon</text><rect class="box" x="420" y="190" width="160" height="120" rx="14"/><text class="n" x="436" y="220">6</text><text class="t" x="436" y="248">Keep it</text><text class="d" x="436" y="274">follow it as</text><text class="d" x="436" y="294">the sky turns</text><path class="ac" d="M182,80 L216,80" marker-end="url(#ah)"/><path class="ac" d="M382,80 L416,80" marker-end="url(#ah)"/><path class="ac" d="M182,250 L216,250" marker-end="url(#ah)"/><path class="ac" d="M382,250 L416,250" marker-end="url(#ah)"/><path class="ac" d="M500,142 L500,165 L100,165 L100,186" marker-end="url(#ah)"/></svg>