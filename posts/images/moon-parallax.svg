</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acf"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1b3"/></marker></defs><rect class="bg" width="600" height="330" rx="16"/>
<circle class="fill2" cx="110" cy="200" r="70" style="stroke:#2e3544;stroke-width:1.5"/>
<circle class="acf" cx="110" cy="200" r="5"/>
<text class="d" x="62" y="232">Earth's</text><text class="d" x="62" y="250">centre</text>
<circle cx="140" cy="137" r="7" fill="#f2cc60"/>
<text class="s" x="84" y="116">me</text>
<circle cx="360" cy="170" r="22" fill="#d9dde5"/>
<text class="s" x="336" y="220">the Moon</text>
<line class="dash" x1="110" y1="200" x2="560" y2="146"/>
<line class="ac" x1="140" y1="137" x2="560" y2="191"/>
<line class="faint" x1="560" y1="40" x2="560" y2="290"/>
<text class="d" x="468" y="36">the stars</text>
<text class="d" x="468" y="54">behind it</text>
<circle class="acf" cx="560" cy="191" r="6"/>
<circle cx="560" cy="146" r="6" fill="#9aa1b3"/>
<text class="s" x="420" y="112">where the software</text>
<text class="s" x="420" y="131">aimed</text>
<text class="s" x="440" y="222">where I saw it</text>
